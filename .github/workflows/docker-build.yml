# 洞真（dongzhen）镜像构建：push 到 service 分支或手动 dispatch 触发。
# 产物：ghcr.io/qq33357486/dongzhen:service（另打 latest）。生产服务器只拉镜像，不在服务器上构建。
name: docker-build

on:
  push:
    branches: [service]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qq33357486/dongzhen:service
            ghcr.io/qq33357486/dongzhen:latest
